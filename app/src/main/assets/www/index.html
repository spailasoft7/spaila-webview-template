<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spaila WebView Test</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111827;
      color: #ffffff;
      text-align: center;
      padding: 60px 20px;
    }
    button {
      font-size: 18px;
      padding: 14px 28px;
      margin: 8px;
      border: none;
      border-radius: 12px;
      background: #22c55e;
      color: #04130a;
    }
  </style>
</head>
<body>
  <h1>Spaila WebView works</h1>
  <p id="message">Not clicked yet</p>
  <button id="tapBtn">Tap me</button>
  <button id="bridgeBtn">Test bridge</button>
  <button id="notifBtn">Test notification</button>

  <script src="spaila.js"></script>
  <script>
    document.getElementById("tapBtn").addEventListener("click", function () {
      document.getElementById("message").textContent = "It works!";
    });
    document.getElementById("bridgeBtn").addEventListener("click", function () {
      Spaila.toast("Hello from JavaScript!");
    });
    document.getElementById("notifBtn").addEventListener("click", function () {
      Spaila.showNotification("Spaila", "This notification came from JavaScript!");
    });
  </script>
</body>
</html>
