plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spaila.webview'   // code package: leave as it is
    compileSdk 36

    defaultConfig {
        applicationId 'com.spaila.later'   // the app's permanent ID on phones and Google Play
        minSdk 24
        targetSdk 36
        // GitHub gives every build a higher number, which Google Play requires
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName '1.0.0'
    }

    // The signing key arrives from GitHub Secrets while building. It is never in the repo.
    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
